# Local production-like stack: PostgreSQL + migrations + app.
#   cp .env.example .env        # then edit secrets
#   docker compose up -d --build
#   docker compose run --rm migrate npm run db:seed      # optional demo data
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinetic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: kinetic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic -d kinetic"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://kinetic:${POSTGRES_PASSWORD:-change-me}@db:5432/kinetic
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Cairo}
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kinetic:${POSTGRES_PASSWORD:-change-me}@db:5432/kinetic
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_NAME: ${APP_NAME:-Kinetic}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Cairo}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
